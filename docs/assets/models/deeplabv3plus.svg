<rect x="52" y="445" width="1176" height="60" rx="14" fill="#ff8ea5" fill-opacity=".09"/>
<text x="74" y="481" font-size="13" font-weight="700" fill="#ff8ea5" letter-spacing="1.3">CORE IDEA</text>
<text x="220" y="482" font-size="18" font-weight="500" fill="#e4edf8" >Fusion happens after ASPP and decoding, unlike the transformer variants.</text>
