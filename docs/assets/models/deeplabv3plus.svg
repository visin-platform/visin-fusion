<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="550" viewBox="0 0 1280 550" role="img">
<title>DeepLabV3+ · late fusion architecture overview</title>
<desc>Two complete encoder–decoder branches meet just before classification</desc>
