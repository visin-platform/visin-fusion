[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "visin-fusion"
dynamic = ["version"]  # visin_fusion/_version.py, written by tools/release.py
description = "Camera and LiDAR fusion models and training tools"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Toomas Tahves"}]
keywords = ["semantic segmentation", "sensor fusion", "lidar", "autonomous driving", "pytorch"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Recognition",
]
dependencies = [
    "torch>=2.2", "torchvision>=0.17", "timm>=1.0", "einops>=0.7",
    # The visin-fusion command and its stages import all of these.
    "numpy", "scipy", "pydantic>=2", "tqdm", "tensorboard", "Pillow>=9.1", "opencv-python", "pandas",
    "psutil", "nvidia-ml-py", "GPUtil", "thop", "fvcore",
]

[project.optional-dependencies]
train = []  # kept so `pip install visin-fusion[train]` still works; everything it named is now core
visin = ["visin", "python-dotenv", "requests"]
hf = ["huggingface_hub>=0.24"]  # hf:// models and hf: datasets; General.hub_repo

dev = ["pytest", "pytest-cov", "coverage>=7.10", "ruff>=0.6", "mypy>=1.10", "pre-commit>=3.5", "build>=1.0", "twine>=6.1"]

[dependency-groups]
# The docs site only, without the package or torch: pip install --group docs
docs = ["mkdocs>=1.6,<2", "mkdocs-material", "pydantic>=2"]

[project.scripts]
visin-fusion = "visin_fusion.cli:main"

[project.urls]
Homepage = "https://github.com/visin-platform/visin-fusion"
Documentation = "https://visin-platform.github.io/visin-fusion/"
Changelog = "https://github.com/visin-platform/visin-fusion/blob/main/CHANGELOG.md"
Issues = "https://github.com/visin-platform/visin-fusion/issues"

[tool.setuptools.packages.find]
include = ["visin_fusion*"]

[tool.setuptools.dynamic]
version = {attr = "visin_fusion._version.__version__"}

[tool.setuptools.package-data]
"visin_fusion" = ["py.typed"]
"visin_fusion.sample" = ["zod_sample/**/*"]
"visin_fusion.config" = ["presets/*.json"]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["venv*", "paper*", "build"]

[tool.ruff.lint]
select = [
  "E", "F", "W", "I", "UP", "B",
  "C4", "SIM", "RUF", "PT", "PIE", "RET", "PERF", "FURB", "LOG", "G", "A", "ISC", "PGH",
  "ERA", "S", "T20", "PLC0415",
  "D100", "D101", "D102", "D103", "D104",
]
# Deliberate exceptions, each with its reason. Fix findings rather than adding to this list.
ignore = [
  "S311",     # random is for augmentation and seeding, never for security
  "S603",     # subprocess runs the stage modules with sys.executable, never user input
  "PERF203",  # per-item error handling in loops is intended
  "A002",     # `type` and `input` are keyword names of the public model constructors
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S108", "PLC0415", "PT011", "PT018", "T201", "D"]
"tools/**" = ["T201", "S607", "S301", "D", "RUF001", "ISC004"]
"visin_fusion/cli.py" = ["T201"]
# Lazy imports, each for an optional dependency or to keep `import visin_fusion` light
"visin_fusion/__init__.py" = ["PLC0415"]  # run() loads the pipeline (torch) on first use
"visin_fusion/data/visin_datasets.py" = ["PLC0415"]  # the optional visin extra
"visin_fusion/hub.py" = ["PLC0415"]  # the optional hf and visin extras
"visin_fusion/engine/callbacks.py" = ["PLC0415"]  # the optional visin extra
"visin_fusion/integrations/settings.py" = ["PLC0415"]  # python-dotenv, from the visin extra
"visin_fusion/logging_setup.py" = ["PLC0415"]  # visin's console logging, if installed
"visin_fusion/utils/system_monitor.py" = ["PLC0415"]  # NVML needs a driver; its absence is handled
"visin_fusion/config/config_schema.py" = ["T201"]

[tool.mypy]
# The modules that are fully annotated; add a path here as more of the package is. Third-party stubs may be
# missing (timm, cv2, GPUtil, ...), so their imports are not errors.
files = [
  "visin_fusion/config",
  "visin_fusion/models",
  "visin_fusion/inference.py",
  "visin_fusion/hub.py",
  "visin_fusion/data/hf_datasets.py",
  "visin_fusion/pipeline.py",
  "visin_fusion/data/preprocessing.py",
]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tools"]
log_level = "INFO"
tmp_path_retention_policy = "failed"
markers = ["e2e: end-to-end runs of the stage scripts on the sample dataset (slow)"]
