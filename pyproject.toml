[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "visin-fusion"
dynamic = ["version"]  # visin_fusion/_version.py, written by tools/release.py
description = "Camera and LiDAR fusion models and training tools"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Toomas Tahves"}]
keywords = ["semantic segmentation", "sensor fusion", "lidar", "autonomous driving", "pytorch"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Recognition",
]
dependencies = ["torch>=2.2", "torchvision>=0.17", "timm>=1.0", "einops>=0.7"]

[project.optional-dependencies]
train = ["numpy", "scipy", "pydantic>=2", "tqdm", "tensorboard", "Pillow", "opencv-python", "pandas", "matplotlib", "psutil", "nvidia-ml-py", "GPUtil", "thop", "fvcore"]
visin = ["visin>=0.2", "python-dotenv", "requests"]

dev = ["pytest", "pytest-cov", "ruff"]

[dependency-groups]
# The docs site only, without the package or torch: pip install --group docs
docs = ["mkdocs>=1.6,<2", "mkdocs-material", "pydantic>=2"]

[project.scripts]
visin-fusion = "visin_fusion.cli:main"

[project.urls]
Homepage = "https://github.com/visin-platform/visin-fusion"
Documentation = "https://visin-platform.github.io/visin-fusion/"
Changelog = "https://github.com/visin-platform/visin-fusion/blob/main/CHANGELOG.md"
Issues = "https://github.com/visin-platform/visin-fusion/issues"

[tool.setuptools.packages.find]
include = ["visin_fusion*"]

[tool.setuptools.dynamic]
version = {attr = "visin_fusion._version.__version__"}

[tool.setuptools.package-data]
"visin_fusion.config" = ["presets/*.json"]
