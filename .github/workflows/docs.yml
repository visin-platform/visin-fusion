# Publishes the documentation site to GitHub Pages.
#
# Called by release.yml with the new tag, so the site describes the version on PyPI. It can also be
# run by hand, to publish a documentation fix without a release. Pull requests check the docs build
# in ci.yml. Repository settings: Pages -> Source: GitHub Actions.

name: Docs

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Tag or branch to publish (default: the latest release tag)"
        required: false
        type: string
  workflow_call:
    inputs:
      ref:
        required: true
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref || github.ref }}
      - name: Default to the latest release
        if: inputs.ref == ''
        run: |
          TAG=$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null || true)
          if [ -n "$TAG" ]; then git checkout "$TAG"; fi
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --upgrade pip && pip install --group docs  # no package, no torch
      - run: mkdocs build --strict
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
