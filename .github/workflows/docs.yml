name: Docs

# Builds the docs site on every pull request that touches it; publishes it to GitHub Pages from main.
# Repository settings: Pages -> Source: GitHub Actions.

on:
  push:
    branches: [main]
    paths: [docs/**, mkdocs.yml, pyproject.toml, visin_fusion/config/config_schema.py, tools/make_config_reference.py, tools/generate_model_diagrams.py,
            .github/workflows/docs.yml]
  pull_request:
    paths: [docs/**, mkdocs.yml, pyproject.toml, visin_fusion/config/config_schema.py, tools/make_config_reference.py, tools/generate_model_diagrams.py,
            .github/workflows/docs.yml]
  workflow_dispatch:

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e '.[docs]'
      - name: Config reference matches the schema
        run: python tools/make_config_reference.py --check
      - name: Model diagrams match their source
        run: python tools/generate_model_diagrams.py --check
      - name: Build (broken links and missing pages fail)
        run: mkdocs build --strict
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
