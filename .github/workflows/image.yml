name: Image

# Builds the training image and pushes it to the GitHub Container Registry:
#   ghcr.io/<owner>/<repo>:<tag>       GPU (CUDA 13.0 torch)
#   ghcr.io/<owner>/<repo>:<tag>-cpu   CPU only
# Tags: the commit SHA always; `latest` from main; `v1.2.3` and `1.2` from version tags.
# Pull requests build without pushing, to catch a broken Dockerfile.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    paths: [Dockerfile, .dockerignore, requirements*.txt, .github/workflows/image.yml]
  workflow_dispatch:

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (${{ matrix.variant }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: gpu
            torch_index: https://download.pytorch.org/whl/cu130
            suffix: ""
          - variant: cpu
            torch_index: https://download.pytorch.org/whl/cpu
            suffix: "-cpu"
    steps:
      - name: Free disk space (the CUDA torch wheels need several GB)
        if: matrix.variant == 'gpu'
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: suffix=${{ matrix.suffix }},onlatest=true
          tags: |
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          build-args: TORCH_INDEX=${{ matrix.torch_index }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.variant }}
          cache-to: type=gha,mode=max,scope=${{ matrix.variant }}
