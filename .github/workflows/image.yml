name: Image

# Builds the training image and pushes it to the GitHub Container Registry:
#   ghcr.io/<owner>/<repo>:<tag>       GPU (CUDA 13.0 torch)
#   ghcr.io/<owner>/<repo>:<tag>-cpu   CPU only
# release.yml calls it for each release, tagged `1.2.3`, `1.2` and `latest`. Run by hand, it builds and
# pushes an image of the chosen branch, tagged with the branch name and the SHA. Pull requests that
# change the image's recipe build without pushing, to catch a broken Dockerfile.

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
  workflow_dispatch:
  pull_request:
    paths: [Dockerfile, .dockerignore, pyproject.toml, .github/workflows/image.yml]

concurrency:
  group: image-${{ inputs.version || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build (${{ matrix.variant }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: gpu
            torch_index: https://download.pytorch.org/whl/cu130
            suffix: ""
          - variant: cpu
            torch_index: https://download.pytorch.org/whl/cpu
            suffix: "-cpu"
    steps:
      - name: Free disk space (the CUDA torch wheels need several GB)
        if: matrix.variant == 'gpu'
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.version && format('v{0}', inputs.version) || github.ref }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: |
            latest=false
            suffix=${{ matrix.suffix }},onlatest=true
          tags: |
            type=sha,format=long,enable=${{ !inputs.version }}
            type=ref,event=branch,enable=${{ !inputs.version }}
            type=semver,pattern={{version}},value=v${{ inputs.version }},enable=${{ !!inputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=v${{ inputs.version }},enable=${{ !!inputs.version }}
            type=raw,value=latest,enable=${{ !!inputs.version }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          build-args: TORCH_INDEX=${{ matrix.torch_index }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.variant }}
          cache-to: type=gha,mode=max,scope=${{ matrix.variant }}
