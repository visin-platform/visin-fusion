# Every check a change must pass. Also called by release.yml, so nothing is published that this has
# not passed.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 2 * * *"  # nightly: every model in every mode
  workflow_dispatch:
    inputs:
      modes:
        description: "Modes for the end-to-end tests (comma-separated)"
        default: "rgb,lidar,fusion"
  workflow_call:

concurrency:
  # One group per calling workflow: a push to main neither cancels nor waits for a release's CI
  group: ci-${{ github.ref }}-${{ github.workflow_ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHON_VERSION: "3.12"

jobs:
  lint:
    name: Lint and syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install ruff
      - name: Syntax (every file compiles)
        run: python -m compileall -q -x '(^|/)(venv[^/]*|\.git)/' .
      - name: Lint (rules in pyproject.toml)
        run: ruff check --output-format github .
      - name: Formatting
        run: ruff format --check .

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install (CPU torch)
        run: |
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -e '.[train,visin,dev]'
      - name: Unit tests with coverage
        run: coverage run -m pytest tests/unit
      - name: Keep unit coverage data
        uses: actions/upload-artifact@v4
        with:
          name: coverage-unit
          path: .coverage.*
          include-hidden-files: true
          if-no-files-found: error

  e2e:
    name: End-to-end (${{ matrix.model }})
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        model: [clft, clftv2, maskformer, mask2former, deeplab]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install (CPU torch)
        run: |
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -e '.[train,visin,dev]'
      - name: Cache pretrained backbone weights
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            ~/.cache/torch
          key: weights-${{ matrix.model }}-v1
      - name: Train, test, visualize and benchmark on the sample dataset
        # Pull requests and pushes run fusion mode; nightly and manual runs all modes.
        env:
          COVERAGE_PROCESS_START: ${{ github.workspace }}/.coveragerc
          PYTHONPATH: ${{ github.workspace }}/tools/coverage_startup:${{ github.workspace }}
        run: >
          coverage run -m pytest tests/e2e --models ${{ matrix.model }} --device cpu --visin offline -rA
          --modes "${{ github.event_name == 'schedule' && 'rgb,lidar,fusion' || github.event.inputs.modes || 'fusion' }}"
      - name: Keep logs of failed runs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-logs-${{ matrix.model }}
          path: /tmp/pytest-of-*/**/logs/*.log
          if-no-files-found: ignore
      - name: Keep end-to-end coverage data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.model }}
          path: .coverage.*
          include-hidden-files: true
          if-no-files-found: error

  package:
    name: Package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Build the sdist and wheel, and check their metadata
        run: |
          pip install build twine
          python -m build
          twine check --strict dist/*
      # What a user gets from pip, installed alone: no source tree, no dev tools
      - name: Models only (core dependencies)
        run: |
          python -m venv "$RUNNER_TEMP/core"
          "$RUNNER_TEMP/core/bin/pip" install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          "$RUNNER_TEMP/core/bin/pip" install dist/*.whl
          cd "$RUNNER_TEMP" && "$RUNNER_TEMP/core/bin/python" -c "
          import torch, visin_fusion
          from visin_fusion.models import CLFTv2
          out = CLFTv2(num_classes=4).eval()(torch.randn(1, 3, 256, 256), torch.randn(1, 3, 256, 256))
          assert out.shape == (1, 4, 256, 256), out.shape
          print('visin-fusion', visin_fusion.__version__, 'models OK')"
      - name: Every extra, and the command line
        run: |
          python -m venv "$RUNNER_TEMP/full"
          "$RUNNER_TEMP/full/bin/pip" install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          "$RUNNER_TEMP/full/bin/pip" install "$(ls dist/*.whl)[train,visin]"
          cd "$RUNNER_TEMP" && "$RUNNER_TEMP/full/bin/visin-fusion" schema > /dev/null
          "$RUNNER_TEMP/full/bin/python" -c "import visin_fusion.engine.stages.train.common, visin_fusion.integrations.visin"

  docs:
    name: Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install --upgrade pip && pip install --group docs  # no package, no torch
      - name: Config reference matches the schema
        run: python tools/make_config_reference.py --check
      - name: Model diagrams match their source
        run: python tools/generate_model_diagrams.py --check
      - name: Build (broken links and missing pages fail)
        run: mkdocs build --strict

  coverage:
    name: Package coverage (>90%)
    needs: [unit, e2e]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install coverage
      - uses: actions/download-artifact@v4
        with:
          pattern: coverage-*
          path: coverage-data
      - name: Combine all package coverage
        run: |
          coverage combine coverage-data/*
          coverage report --fail-under=90.1
