name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 2 * * *"  # nightly: every model in every mode
  workflow_dispatch:
    inputs:
      modes:
        description: "Modes for the end-to-end tests (comma-separated)"
        default: "rgb,lidar,fusion"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

jobs:
  lint:
    name: Lint and syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install ruff
      - name: Syntax (every file compiles)
        run: python -m compileall -q -x '(^|/)(venv[^/]*|\.git)/' .
      - name: Lint (rules in ruff.toml)
        run: ruff check --output-format github .
      - name: Full lint report (not enforced)
        run: ruff check --select ALL --statistics --exit-zero .

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install (CPU torch)
        run: |
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-dev.txt
      # Coverage floor (.coveragerc); raise it as tests are added (TODO.md, section 3)
      - run: pytest tests/unit --cov --cov-report=term --cov-fail-under=35

  e2e:
    name: End-to-end (${{ matrix.model }})
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        model: [clft, swin, maskformer, mask2former, deeplab]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install (CPU torch)
        run: |
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-dev.txt
      - name: Cache pretrained backbone weights
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            ~/.cache/torch
          key: weights-${{ matrix.model }}-v1
      - name: Train, test, visualize and benchmark on the sample dataset
        # Pull requests and pushes run the fusion mode (both branches); nightly and manual runs all modes.
        run: >
          pytest tests/e2e --models ${{ matrix.model }} --device cpu --visin offline -rA
          --modes "${{ github.event_name == 'schedule' && 'rgb,lidar,fusion' || github.event.inputs.modes || 'fusion' }}"
      - name: Keep logs of failed runs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-logs-${{ matrix.model }}
          path: /tmp/pytest-of-*/**/logs/*.log
          if-no-files-found: ignore
